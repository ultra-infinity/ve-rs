[workspace]
resolver = "2"
members = [
  "crates/untrusted",
  "crates/untrusted-derive",
  "crates/cargo-untrusted",
  "crates/net",
  "crates/wireguard",
  "crates/wireguard-libcrux",
  "crates/wg-userspace",
  "crates/adfilter",
  "crates/adfilter-pcap",
  "examples/derive-demo",
  "examples/net-pcap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# `wg-userspace` is a `no_std` binary: it has no unwinding runtime.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
