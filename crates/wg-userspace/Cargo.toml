[package]
name = "wg-userspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A no_std userspace WireGuard interface around the verified `wireguard` device, on `wg-runtime`"

[dependencies]
wg-runtime = { path = "../wg-runtime" }
wireguard = { path = "../wireguard" }
wireguard-libcrux = { path = "../wireguard-libcrux" }
libc = { version = "0.2", default-features = false }
